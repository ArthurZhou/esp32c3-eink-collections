[platformio]
default_envs = esp32c3

[env]
; ESP32-C3 (RISC-V) needs arduino-esp32 >= 2.0.x, so we moved off the Xtensa-only
; v3.5.0 pin. espressif32 v6.9.0 pairs arduino-esp32 2.0.x with the matching
; RISC-V toolchain and ships the esp32-c3-devkitm-1 board.
platform = espressif32@6.9.0
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
; src/ 按分层子目录组织（drivers/ screens/ renderer/），裸 include 即可解析。
build_flags = -Isrc
; Regenerate include/webpage.h from data/index.html before every build.
extra_scripts = pre:scripts/embed_html.py

[env:esp32c3]
upload_protocol = esptool

[env:ota]
extends = env:esp32c3
upload_protocol = espota
upload_port = inkscreen-esp32c3.local
upload_flags =
    --auth=change-this-ota-password
